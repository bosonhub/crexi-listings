name: Scrape Crexi Listings

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without publishing listing data
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: commercial-feed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts
      - name: Test data integrity
        run: npm test
      - name: Install standard Chromium
        run: npx playwright install chromium --with-deps
      - name: Collect and validate listings
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: npm run scrape
      - name: Preserve diagnostics and candidate data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-feed-check-${{ github.run_id }}
          path: |
            scrape-status.json
            listings-candidate.json
            diagnostics/
          retention-days: 7
          if-no-files-found: ignore
      - name: Publish validated data only
        if: success() && github.ref == 'refs/heads/main'
        run: |
          if [ -f .scraper_updated ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add listings.json scrape-status.json
            git diff --staged --quiet || git commit -m "chore: publish validated commercial listings"
            git push
          fi
